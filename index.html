<style>
  :root { --navy:#22243a; --navy2:#2c2f4d; --blue:#4d97f2; --y:#f2f185; --pink:#f7605c; --mute:#b9bcd6; --ink:#22243a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body { min-height:100vh; background:var(--navy); color:#fff; font-family:'Montserrat', system-ui, sans-serif; overflow-x:hidden;
         background-image:radial-gradient(700px 420px at 85% -5%, var(--navy2) 0%, rgba(34,36,58,0) 70%); }
  .gears { position:fixed; right:-60px; top:-40px; width:300px; opacity:.12; pointer-events:none; }
  main { position:relative; max-width:460px; margin:0 auto; padding:44px 16px 36px; }
  .top { text-align:center; }
  .avatar { width:128px; height:128px; border-radius:50%; object-fit:cover; display:block; margin:0 auto; box-shadow:0 0 0 0 rgba(0,0,0,0), 0 12px 34px rgba(77,151,242,.35); }
  .who { margin-top:14px; font-weight:800; font-size:20px; }
  .brand { margin-top:6px; display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--mute); }
  .brand img { width:22px; height:auto; }
  h1 { margin-top:22px; font-weight:900; font-size:32px; line-height:1.12; letter-spacing:-.6px; }
  .mark { background:var(--y); color:var(--ink); padding:0 .14em; border-radius:.12em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .sub { margin-top:12px; font-weight:600; font-size:16px; line-height:1.45; color:#dfe1f0; }
  .creds { margin-top:16px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .cred { font-weight:700; font-size:13px; padding:7px 12px; border-radius:999px; background:rgba(77,151,242,.16); border:1.5px solid rgba(77,151,242,.45); color:#cfe2fc; text-decoration:none; }
  .cred .star { color:var(--y); }
  .links { margin-top:28px; display:flex; flex-direction:column; gap:12px; }
  .btn { display:block; text-decoration:none; color:var(--ink); background:#fff; border-radius:18px; padding:16px 20px; position:relative;
         box-shadow:0 6px 18px rgba(0,0,0,.22); transition:transform .15s ease, box-shadow .15s ease; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.3); }
  .btn:focus-visible { outline:3px solid var(--y); outline-offset:3px; }
  .btn .t { display:block; font-weight:800; font-size:17px; line-height:1.25; padding-right:28px; }
  .btn .s { display:block; margin-top:3px; font-weight:600; font-size:13.5px; color:#5a5d7a; padding-right:28px; }
  .btn::after { content:'→'; position:absolute; right:20px; top:50%; transform:translateY(-50%); font-weight:800; font-size:18px; color:var(--blue); }
  .btn.feat { background:var(--y); padding:20px 20px 18px; }
  .btn.feat::after { color:var(--ink); }
  .btn.feat .kick { display:inline-block; font-weight:800; font-size:12px; letter-spacing:.4px; text-transform:uppercase; color:var(--ink); opacity:.75; }
  .btn.feat .t { font-size:21px; margin-top:2px; }
  .btn.feat .s { color:#3d4060; }
  .btn.feat .tag { display:inline-block; margin-top:10px; background:var(--pink); color:#fff; font-weight:800; font-size:12.5px; padding:5px 10px; border-radius:8px; }
  .btn.off { pointer-events:none; }
  .btn.off::after { content:none; }
  .social { margin-top:30px; display:flex; justify-content:center; gap:14px; }
  .social a { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); transition:background .15s; }
  .social a:hover { background:rgba(255,255,255,.16); }
  .social a:focus-visible { outline:3px solid var(--y); outline-offset:3px; }
  .social svg { width:20px; height:20px; fill:#fff; }
  footer { margin-top:26px; text-align:center; font-weight:600; font-size:12.5px; color:var(--mute); line-height:1.6; }
  footer a { color:var(--mute); }
  @media (prefers-reduced-motion: reduce) { .btn, .social a { transition:none; } .btn:hover { transform:none; } }
</style>

const tag = (url, campaign) => {
  try { const u = new URL(url);
    if (/yourbestnextmove\.com$|scoreapp\.com$|hsforms\.com$|hubspot/.test(u.hostname)) {
      u.searchParams.set('utm_source', src); u.searchParams.set('utm_medium', 'social'); u.searchParams.set('utm_campaign', campaign || 'link-page'); }
    return u.toString(); } catch { return url; }
};

/* decorative gears */
function gearPath(cx, cy, r, teeth) {
  const ri = r * 0.8, pts = [], step = Math.PI * 2 / teeth;
  for (let i = 0; i < teeth; i++) { const a = i * step, w = step * 0.26;
    pts.push([a - w * 1.25, ri], [a - w * 0.8, r], [a + w * 0.8, r], [a + w * 1.25, ri], [a + step / 2, ri]); }
  return pts.map((p, i) => (i ? 'L' : 'M') + (cx + p[1] * Math.cos(p[0])).toFixed(1) + ' ' + (cy + p[1] * Math.sin(p[0])).toFixed(1)).join(' ') + ' Z';
}
document.getElementById('gears').innerHTML = [[150, 120, 90, 12, '#4d97f2'], [240, 210, 55, 9, '#f2f185'], [90, 240, 42, 8, '#a9cdfa']]
  .map(([cx, cy, r, t, c]) => `<path d="${gearPath(cx, cy, r, t)}" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${r * .32}" fill="none" stroke="${c}" stroke-width="6"/>`).join('');
